
name: Build 91 SPEED SHOP APK

on:
  workflow_dispatch:
  push:
    paths:
      - "91_SPEED_SHOP_WEB.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare website
        run: |
          unzip 91_SPEED_SHOP_WEB.zip
          mkdir -p www
          cp 91_SPEED_SHOP_WEB/index.html www/index.html

      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npx cap init "91 SPEED SHOP" "com.ninespeedshop.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 91-SPEED-SHOP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
